version: 1
app: AppName
# Pair this manifest with an app runner at scripts/customer_ui_action_sweep.rb.
# The runner must be invoked through ./scripts/SaneMaster.rb customer_ui_sweep
# and must write outputs/customer_ui_action_receipt.json with per-action:
#   workflow.runner, workflow.steps_completed, workflow.outcome, workflow.artifacts
#   evidence entries whose path/artifact/file values point at real Mini artifacts.
actions:
  - id: primary-window-actions
    title: Primary window actions are live
    surfaces:
      - Main window
      - Primary toolbar
      - Primary list/detail rows
    steps:
      - Click every primary button, toggle, segmented control, menu, row action, and empty-state action exactly as a customer would.
      - Verify the visible state, persisted state, and relaunch state agree.
      - Cancel destructive or externally visible actions unless the app has an isolated test account or fixture.
    assertions:
      - No visible control is decorative or dead.
      - Counts, enabled states, and row state agree after each action.
      - Empty, loading, error, Basic, and Pro states do not expose impossible actions.
    evidence:
      - Mini AX click transcript
      - Mini screenshot or deterministic render
    required_proof_level: runtime_visual
    required_evidence_types:
      - mini_click
      - screenshot
    historical_failure_classes:
      - activation_noop
      - state_count_drift
    functional_state:
      description: Seeded workspace with representative rows/items so controls are enabled the way a customer sees them.
      setup_steps:
        - Launch the app with the standard customer UI fixture before clicking.
    expected_outputs:
      - Visible state changes match the clicked control and persist after relaunch where promised.

  - id: menus-and-entry-points
    title: Menus and alternate entry points are live
    surfaces:
      - Menu bar or status item menu
      - Dock menu
      - Context menus
      - Keyboard shortcuts
      - URL schemes, App Intents, AppleScript, Finder extensions, or other app-specific integrations
    steps:
      - Open every customer-facing menu and context menu.
      - Trigger every non-destructive command.
      - Verify destructive, purchase, send, delete, quit, and external-link commands reach the intended confirmation or first safe surface.
      - Exercise every advertised automation or system-integration entry point.
    assertions:
      - Every advertised command is present, enabled when applicable, and wired to behavior.
      - Alternate entry points match the primary UI behavior.
      - Permission, auth, and Pro gates fail visibly instead of silently succeeding.
    evidence:
      - Mini menu/action transcript
      - Automation transcript
    required_proof_level: runtime_visual
    required_evidence_types:
      - mini_click
      - screenshot
    historical_failure_classes:
      - menu_entry_missing
      - duplicate_or_stale_menu_item
      - shortcut_focus_or_dispatch
    functional_state:
      description: Seeded app state with at least one representative file/project/item selected where menu commands depend on selection.
      setup_steps:
        - Create or select the fixture item before opening menus and context menus.
    expected_outputs:
      - Menu command appears, is enabled only when valid, and reaches its promised safe surface or completed state.

  - id: settings-onboarding-license-support
    title: Settings, onboarding, license, update, and support flows are complete
    surfaces:
      - Settings tabs
      - Onboarding
      - License or purchase views
      - Updates
      - About, diagnostics, support, feedback, and bug report views
    steps:
      - Select every settings tab and click every customer-facing control family.
      - Run clean-state onboarding through Basic, Pro, permission, import, restore, and existing-customer paths where applicable.
      - Open purchase, restore, activate, deactivate, update, about, diagnostics, support, and bug-report surfaces without completing real external actions.
    assertions:
      - Every tab/view renders without clipped, overlapped, blank, stale, or disabled-by-mistake controls.
      - Permission and purchase boundaries match the app’s public copy.
      - Support and diagnostics paths produce the expected report or safe external destination.
    evidence:
      - Mini settings/onboarding screenshot set
      - Mini click transcript
    required_proof_level: safe_first_surface
    required_evidence_types:
      - mini_click
      - screenshot
    historical_failure_classes:
      - permission_recovery_dead_end
      - pro_basic_gate_drift
      - docs_promise_drift
    functional_state:
      description: Clean-state and existing-user states are both available so onboarding, permissions, license, and support paths are tested as customers encounter them.
      setup_steps:
        - Reset app defaults for clean-state onboarding.
        - Seed an existing-user fixture for settings/license/support surfaces.
    expected_outputs:
      - Each setup, license, permission, update, support, or diagnostic action reaches the correct visible result or safe first surface.

  - id: import-export-reset-and-recovery
    title: Data import, export, reset, migration, and recovery flows are safe
    surfaces:
      - Import/export controls
      - Reset confirmations
      - Migration/import preview
      - Repair/recovery tools
    steps:
      - Export to a temporary file and validate the file.
      - Import valid and invalid fixtures, including cancel/apply paths.
      - Open reset/delete confirmations, cancel them, and run isolated apply scenarios when safe.
      - Exercise repair/recovery actions and confirm the app remains usable after relaunch.
    assertions:
      - User data is not lost without confirmation.
      - Invalid imports fail with visible errors and no partial state.
      - Recovery actions leave the app in a usable, internally consistent state.
    evidence:
      - Mini file-state transcript
      - Before/after state receipt
    required_proof_level: fixture_completion
    required_evidence_types:
      - fixture
    historical_failure_classes:
      - data_loss_or_unexpected_mutation
      - persistence_or_relaunch_reset
    functional_state:
      description: Temporary files/projects are seeded so import, export, reset, migration, and recovery actions operate on real data.
      fixture_paths:
        - Tests/Fixtures/customer-ui/
    user_inputs:
      - Valid fixture import
      - Invalid fixture import
      - Temporary export destination
    expected_outputs:
      - Exported file is valid.
      - Valid import changes state as promised.
      - Invalid import fails visibly without partial mutation.
