# SaneApps Standard Git Hooks (via Lefthook)
# Source of truth: infra/SaneProcess/templates/lefthook.yml
#
# Install: lefthook install (once per clone)
# Skip:    LEFTHOOK=0 git commit ...
#
# No Bundler required — uses system swiftlint + SaneMaster.rb directly.
# Projects WITH Bundler can override individual commands in lefthook-local.yml,
# but that file must stay untracked and machine-local.

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.swift"
      run: swiftlint lint --fix {staged_files} && git add {staged_files}

    file_size_check:
      glob: "*.swift"
      run: |
        swiftlint lint --strict {staged_files} 2>&1 | grep -q "file_length.*error" \
          && (echo "❌ File exceeds 800 lines. Refactor before committing." && exit 1) \
          || exit 0

pre-push:
  parallel: false
  commands:
    verify:
      # env -u BUNDLE_PATH/RUBYOPT: the lefthook shim sets BUNDLE_PATH=vendor/bundle
      # when a Gemfile.lock exists, but these projects' gems are system-installed
      # (header above: "No Bundler required"). A partial vendor/bundle then makes
      # bundler/setup fail with GemNotFound and crashes every push. Strip those
      # vars so verify resolves gems from the system home.
      run: env -u BUNDLE_PATH -u RUBYOPT ./scripts/SaneMaster.rb verify
