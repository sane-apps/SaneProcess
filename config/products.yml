# SaneApps Product Configuration
# Single source of truth for product identifiers across all scripts.
# When a UUID, domain, or slug changes, update HERE — everything reads from this file.
#
# Used by: link_monitor.rb, validation_report.rb, morning-report.sh, sane-checkout Worker
# NOTE:
# - checkout_uuid present = product is live, include in critical link monitoring
# - checkout_uuid missing = unreleased, skip checkout/redirect/appcast checks
# - license_gated: true = Basic/Pro gating active, all release channels allowed (GitHub, Homebrew, R2)
# - license_gated missing/false = no gating, distribution restricted to Cloudflare R2/dist only

products:
  sanebar:
    name: SaneBar
    donation_url: https://github.com/sponsors/MrSaneApps
    license_gated: true    # RETIRED: free + open source (MIT), not sold. Kept true so the audit still permits public GitHub releases (correct for OSS); does NOT mean paid/gated. Do not advertise - see sanebar-retired memory.
    domain: sanebar.com
    dist_domain: dist.sanebar.com
    github_repo: sane-apps/SaneBar
    appcast: https://sanebar.com/appcast.xml

  saneclick:
    name: SaneClick
    checkout_uuid: 679dbd1d-b808-44e7-98c8-8e679b592e93
    license_gated: true    # Basic/Pro gating active — all release channels allowed
    domain: saneclick.com
    dist_domain: dist.saneclick.com
    github_repo: sane-apps/SaneClick
    appcast: https://saneclick.com/appcast.xml

  saneclip:
    name: SaneClip
    checkout_uuid: e0d71010-bd20-49b6-b841-5522b39df95f
    license_gated: true    # Basic/Pro gating active — all release channels allowed
    domain: saneclip.com
    dist_domain: dist.saneclip.com
    github_repo: sane-apps/SaneClip
    appcast: https://saneclip.com/appcast.xml

  sanehosts:
    name: SaneHosts
    checkout_uuid: 83977cc9-900f-407f-a098-959141d474f2
    license_gated: true    # Basic/Pro gating active — all release channels allowed
    domain: sanehosts.com
    dist_domain: dist.sanehosts.com
    github_repo: sane-apps/SaneHosts
    appcast: https://sanehosts.com/appcast.xml

  sanescan:
    name: SaneScan
    type: ios_app
    domain: sanescan.saneapps.com
    github_repo: sane-apps/SaneScan
    appstore_id: "6770391054"
    storekit_product_id: com.sanescan.app.pro.yearly6

  sanesync:
    name: SaneSync
    # Unreleased: no checkout UUID yet
    domain: sanesync.com
    dist_domain: dist.sanesync.com
    github_repo: sane-apps/SaneSync
    appcast: https://sanesync.com/appcast.xml

  sanevideo:
    name: SaneVideo
    checkout_uuid: 478d2602-9808-4591-b01b-d555cccd0185
    checkout_url: "https://saneapps.lemonsqueezy.com/checkout/custom/dc3fd28c-8e5c-4a97-8825-9a8d8d02d0d7?signature=10ffef9988f4239a31fcfcd5a7dd8ef81735dcfa6b5b9d33c5effbd0e7a99848"
    license_gated: true    # Basic/Pro gating active — all release channels allowed
    minimum_macos_exception:
      version: "15.0"
      reason: "Intentional v1 floor: SaneVideo relies on macOS 15 ScreenCaptureKit/audio capture and WhisperKit-era workflows; README and CHANGELOG disclose Sequoia+."
    domain: sanevideo.com
    dist_domain: dist.sanevideo.com
    github_repo: sane-apps/SaneVideo
    appcast: https://sanevideo.com/appcast.xml

  sanesales:
    name: SaneSales
    type: universal
    license_gated: true    # Basic/Pro gating active — all release channels allowed
    domain: sanesales.com
    dist_domain: dist.sanesales.com
    github_repo: sane-apps/SaneSales
    appcast: https://sanesales.com/appcast.xml
    checkout_uuid: 5f7903d4-d6c8-4da4-b3e3-4586ef86bb51

# LemonSqueezy store configuration
store:
  slug: saneapps
  base_url: https://saneapps.lemonsqueezy.com
  checkout_base: https://saneapps.lemonsqueezy.com/checkout/buy

# Redirect Worker
redirect:
  base_url: https://go.saneapps.com/buy

bundles:
  bundle:
    name: SaneApps Everything Bundle
    checkout_url: "https://saneapps.lemonsqueezy.com/checkout/custom/b572a5cf-2eb4-490d-adea-51d5fc57d6e4?signature=94dfad4c052a2d416089189cf63f11fffd2e1a3265109b08bf0fc3f9c56b8328"
    route: https://go.saneapps.com/buy/bundle
    price: "$49.99"
    includes:
      - saneclip
      - saneclick
      - sanehosts
      - sanesales
      - sanevideo
    note: "One Lemon license key for current direct Mac Pro apps. App Store purchases are handled separately by Apple."

# Domains to monitor for expiry (includes unreleased products)
all_domains:
  - sanebar.com
  - saneclip.com
  - saneclick.com
  - sanehosts.com
  - sanesales.com
  - sanescan.saneapps.com
  - saneapps.com
  - sanesync.com
  - sanevideo.com
